app-id: org.example.FlipApp
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable

finish-args:
  - --socket=wayland
  - --socket=x11
  - --share=ipc
  - --filesystem=xdg-download
  - --filesystem=xdg-documents

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: flipapp
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/flipapp/cargo
    build-commands:
      - cargo build --offline --release
      - install -Dm0755 target/release/FlipApp ${FLATPAK_DEST}/bin/flipapp
      - install -Dm0644 libpdfium.so ${FLATPAK_DEST}/lib/libpdfium.so
      - install -Dm0644 org.example.FlipApp.desktop ${FLATPAK_DEST}/share/applications/org.example.FlipApp.desktop
    sources:
      - type: dir
        path: .
      - cargo-sources.json
      - type: file
        path: libpdfium.so
      - type: file
        path: org.example.FlipApp.desktop